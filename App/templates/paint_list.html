{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paints List</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background:#0f172a;
    color:white;
    font-family:'Poppins',sans-serif;
}

/* TOP BAR */
.topbar{
    background:#111827;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.topbar h2{
    color:#38bdf8;
    margin:0;
}

/* GRID */
.paint-card{
    background:#1e293b;
    border-radius:15px;
    overflow:hidden;
    transition:0.3s;
    height:100%;
}

.paint-card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 15px #38bdf8;
}

.paint-card img{
    width:100%;
    height:170px;
    object-fit:cover;
}

.paint-content{
    padding:12px;
}

.category{
    background:#38bdf8;
    color:black;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
}

.price{
    color:#38bdf8;
    font-weight:700;
    font-size:20px;
}

/* BUTTONS */
.buy-btn{
    width:100%;
    border:none;
    background:#38bdf8;
    padding:10px;
    border-radius:10px;
    font-weight:600;
}

.buy-btn:hover{
    background:white;
}

.cart-btn{
    width:100%;
    border:none;
    background:#22c55e;
    padding:10px;
    border-radius:10px;
    font-weight:600;
    color:white;
}

.cart-btn:hover{
    background:white;
    color:#22c55e;
}

.delete-btn{
    width:100%;
    border:none;
    background:#ef4444;
    padding:10px;
    border-radius:10px;
    font-weight:600;
    color:white;
}

.delete-btn:hover{
    background:white;
    color:#ef4444;
}

</style>

</head>

<body>

<!-- TOP BAR -->
<div class="topbar">

    <h2><i class="bi bi-brush"></i> Paint Collection</h2>

    <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-info">
        Back Home
    </a>

</div>

<!-- PAINT GRID -->
<div class="container mt-4">

    <div class="row g-4">

        {% for paint in paints %}

        <div class="col-md-3">

            <div class="paint-card">

                <img src="{{ paint.image.url }}">

                <div class="paint-content">

                    <span class="category">
                        {{ paint.category }}
                    </span>

                    <h5 class="mt-2">{{ paint.name }}</h5>

                    <p style="font-size:13px;">
                        {{ paint.description|truncatewords:15 }}
                    </p>

                    <div class="price">
                        ₹ {{ paint.price }}
                    </div>

                    

                    <!-- DELETE (ADMIN ONLY) -->
                    {% if request.session.is_admin %}

                    <a href="{% url 'delete_paint' paint.id %}" class="btn delete-btn mt-2">
                        <i class="bi bi-trash-fill"></i> Delete
                    </a>

                    {% endif %}

                </div>

            </div>

        </div>

        {% empty %}

        <h4 class="text-center">No Paints Found</h4>

        {% endfor %}

    </div>

</div>

</body>
</html>
