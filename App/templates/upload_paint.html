{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload Paint</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Poppins;
}

.container{
    margin-top:50px;
    max-width:600px;
    background:#1e293b;
    padding:30px;
    border-radius:15px;
}

h2{
    text-align:center;
    color:#38bdf8;
    margin-bottom:20px;
}

.btn{
    background:#38bdf8;
    border:none;
    width:100%;
}

.btn:hover{
    background:white;
}

</style>

</head>

<body>

<div class="container">

    <h2>Upload New Paint</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Upload</button>

    </form>

</div>

</body>
</html>
