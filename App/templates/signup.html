{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signup</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
}

.form-box{
    width:420px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
    padding:40px;
    border-radius:25px;
    color:white;
    box-shadow:0 0 40px rgba(0,0,0,0.5);
}

.form-box h1{
    text-align:center;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
    font-size:15px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(to right,#2563eb,#7c3aed);
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

p{
    margin-top:18px;
    text-align:center;
}

a{
    color:#38bdf8;
    text-decoration:none;
}

.msg{
    text-align:center;
    margin-bottom:15px;
    color:#22c55e;
}

</style>

</head>

<body>

<div class="form-box">

    <h1>Create Account</h1>

    <div class="msg">
        {{ message }}
    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="input-box">
            {{ form.name }}
        </div>

        <div class="input-box">
            {{ form.email }}
        </div>

        <div class="input-box">
            {{ form.mobile }}
        </div>

        <div class="input-box">
            {{ form.password }}
        </div>

        <button type="submit">
            Signup
        </button>

    </form>

    <p>
        Already have account?
        <a href="{% url 'login' %}">
            Login
        </a>
    </p>

</div>

</body>
</html>
