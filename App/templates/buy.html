
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Secure Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f1f3f6;
    font-family:Poppins,sans-serif;
}

/* ================= TOPBAR ================= */

.topbar{
    background:#2874f0;
    color:white;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:22px;
    font-weight:700;
}

.secure{
    font-size:14px;
}

/* ================= CARD ================= */

.payment-card{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-top:20px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

/* ================= PRODUCT ================= */

.product-box{
    display:flex;
    gap:15px;
    align-items:center;
}

.product-image{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:12px;
}

.product-name{
    font-size:20px;
    font-weight:700;
}

.product-category{
    color:gray;
    font-size:13px;
    margin-top:5px;
}

.product-price{
    font-size:26px;
    color:#ff3f6c;
    font-weight:700;
    margin-top:10px;
}

/* ================= SECURITY ================= */

.security-box{
    margin-top:20px;
    background:#eefaf1;
    color:#28a745;
    padding:12px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
}

/* ================= SECTION ================= */

.section-title{
    margin-top:25px;
    margin-bottom:15px;
    font-size:18px;
    font-weight:700;
}

/* ================= UPI GRID ================= */

.upi-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.upi-card{
    background:#fafafa;
    border:2px solid transparent;
    border-radius:14px;
    padding:15px;
    text-align:center;
    transition:0.3s;
}

.upi-card:hover{
    border-color:#2874f0;
    transform:translateY(-3px);
}

.upi-card img{
    width:55px;
    height:55px;
    object-fit:contain;
}

.upi-name{
    margin-top:10px;
    font-size:14px;
    font-weight:600;
}

/* ================= BUTTON ================= */

.pay-btn{
    width:100%;
    background:#fb641b;
    color:white;
    border:none;
    padding:15px;
    border-radius:10px;
    margin-top:25px;
    font-size:17px;
    font-weight:700;
    transition:0.3s;
}

.pay-btn:hover{
    background:#f75b0c;
}

/* ================= FOOTER ================= */

.footer-text{
    text-align:center;
    margin-top:18px;
    color:gray;
    font-size:13px;
}

/* ================= MOBILE ================= */

@media(max-width:576px){

    .product-box{
        flex-direction:column;
        text-align:center;
    }

    .upi-grid{
        grid-template-columns:1fr 1fr;
    }

    .product-image{
        width:100px;
        height:100px;
    }

}

</style>

</head>

<body>

<!-- ================= TOPBAR ================= -->

<div class="topbar">

    <div class="logo">

        Flipkart Pay

    </div>

    <div class="secure">

        <i class="bi bi-shield-lock-fill"></i>

        Secure

    </div>

</div>

<!-- ================= CONTAINER ================= -->

<div class="container pb-5">

<div class="payment-card">

    <!-- ================= PRODUCT ================= -->

    <div class="product-box">

        <img src="{{ paint.image.url }}"
             class="product-image">

        <div>

            <div class="product-name">

                {{ paint.name }}

            </div>

            <div class="product-category">

                {{ paint.category }}

            </div>

            <div class="product-price">

                ₹ {{ paint.price }}

            </div>

        </div>

    </div>

    <!-- ================= SECURITY ================= -->

    <div class="security-box">

        <i class="bi bi-lock-fill"></i>

        100% Secure Payment Gateway

    </div>

    <!-- ================= UPI APPS ================= -->

    <div class="section-title">

        Available Payment Apps

    </div>

    <div class="upi-grid">

        <!-- GPAY -->

        <div class="upi-card">

            <img src="https://upload.wikimedia.org/wikipedia/commons/7/71/Google_Pay_Logo.svg">

            <div class="upi-name">

                Google Pay

            </div>

        </div>

        <!-- PHONEPE -->

        <div class="upi-card">

            <img src="https://download.logo.wine/logo/PhonePe/PhonePe-Logo.wine.png">

            <div class="upi-name">

                PhonePe

            </div>

        </div>

        <!-- PAYTM -->

        <div class="upi-card">

            <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Paytm_logo.png">

            <div class="upi-name">

                Paytm

            </div>

        </div>

        <!-- BHIM -->

        <div class="upi-card">

            <img src="https://upload.wikimedia.org/wikipedia/commons/9/9d/BHIM.svg">

            <div class="upi-name">

                BHIM

            </div>

        </div>

        <!-- AMAZON PAY -->

        <div class="upi-card">

            <img src="https://download.logo.wine/logo/Amazon_Pay/Amazon_Pay-Logo.wine.png">

            <div class="upi-name">

                Amazon Pay

            </div>

        </div>

        <!-- WHATSAPP PAY -->

        <div class="upi-card">

            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">

            <div class="upi-name">

                WhatsApp Pay

            </div>

        </div>

    </div>

    <!-- ================= PAYMENT BUTTON ================= -->

    <button id="rzp-button1"
            class="pay-btn">

        Pay ₹ {{ paint.price }}

    </button>

    <!-- ================= FOOTER ================= -->

    <div class="footer-text">

        Powered by Razorpay

    </div>

</div>

</div>

<!-- ================= RAZORPAY ================= -->

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>


<script>

function startPayment(){

    var options = {

        "key": "{{ razorpay_key }}",

        "amount": "{{ payment.amount }}",

        "currency": "INR",

        "name": "Birla Paint Store",

        "description": "Painting Purchase",

        "order_id": "{{ payment.id }}",

        "handler": function (response){

            window.location.href =
            "{% url 'payment_success' %}";

        },

        "theme": {
            "color": "#2874f0"
        }
    };

    var rzp1 = new Razorpay(options);

    rzp1.open();
}

</script>


</body>
</html>
