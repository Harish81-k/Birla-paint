{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Payment Success</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background:#f5f5f5;
    font-family:Poppins,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
}

.success-box{
    background:white;
    width:100%;
    max-width:420px;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.check{
    width:90px;
    height:90px;
    background:#28a745;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
}

.check i{
    color:white;
    font-size:45px;
}

.title{
    margin-top:20px;
    font-size:28px;
    font-weight:700;
}

.text{
    margin-top:10px;
    color:gray;
}

.btn-home{
    width:100%;
    margin-top:25px;
    background:#2874f0;
    color:white;
    border:none;
    padding:13px;
    border-radius:10px;
    text-decoration:none;
    display:block;
    font-weight:600;
}

</style>

</head>

<body>

<div class="success-box">

    <div class="check">

        <i class="bi bi-check-lg"></i>

    </div>

    <div class="title">

        Payment Successful

    </div>

    <div class="text">

        Your order has been placed successfully.

    </div>

    <a href="{% url 'home' %}"
       class="btn-home">

       Continue Shopping

    </a>

</div>

</body>
</html>
